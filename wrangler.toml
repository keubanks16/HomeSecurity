name = "home-security"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The app (HTML/JS/icons) is served from ./public
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Checks the doorbell for rings/motion every minute
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "HOME_KV"
id = "REPLACE_WITH_KV_ID"

[vars]
# Tuya data center for your account. Eastern/Western US = tuyaus.com
TUYA_BASE = "https://openapi.tuyaus.com"
TIMEZONE = "America/New_York"
VAPID_SUBJECT = "mailto:you@example.com"
# If your doorbell reports different codes, list them here (see /api/debug/logs)
# RING_CODES = "doorbell_active,doorbell_pic"
# MOTION_CODES = "movement_detect_pic,alarm_message"

# Secrets (set with `npx wrangler secret put NAME`, never put them in this file):
#   TUYA_CLIENT_ID, TUYA_CLIENT_SECRET, TUYA_DEVICE_ID,
#   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, APP_PIN
